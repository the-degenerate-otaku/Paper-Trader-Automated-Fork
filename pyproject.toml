[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "paper-trader-automated"
version = "0.1.0"
description = "Local, paper-only NSE trading terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6,<7",
  "tzdata>=2026.1",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "yfinance>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-PyYAML>=6", "pandas-stubs", "bandit>=1.9,<2", "pip-audit>=2.10,<3"]

[project.scripts]
paper-trader = "paper_trader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
