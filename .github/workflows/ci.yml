name: NSE checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --extra dev
      - run: uv run --frozen --extra dev python -m ruff check src tests scripts
      - run: uv run --frozen --extra dev python -m ruff format --check src tests scripts
      - run: uv run --frozen --extra dev python -m mypy src
      - run: uv run --frozen --extra dev python -m bandit -q -r src
      - run: uv run --frozen --extra dev python -m pytest
      - run: uv run --frozen --extra dev python scripts/privacy_scan.py
      - run: uv run --frozen --extra dev python -m pip_audit --skip-editable
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx eslint src/pages/Terminal.tsx src/App.tsx src/theme.ts
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
